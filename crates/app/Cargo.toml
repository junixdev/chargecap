[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Menu-bar app that talks to chargecapd over its Unix socket"
authors = ["Rymera"]
# Internal tool — never publish to crates.io.
publish = false

[[bin]]
name = "chargecap"
path = "src/main.rs"

[dependencies]
# Wire contract and file paths shared with the daemon.
proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error context for startup/socket failure paths.
anyhow = "1"
