[package]
name = "proto"
version = "0.1.0"
edition = "2021"
description = "Wire contract and file paths shared by chargecapd and chargecap"
authors = ["Junix Villacorta"]
license = "MIT"
repository = "https://github.com/junixdev/chargecap"
# Workspace member with a generic crate name; not meant for crates.io.
publish = false

[dependencies]
# (De)serializes the daemon<->app JSON wire protocol.
serde = { version = "1", features = ["derive"] }
# Encodes/decodes the newline-delimited JSON frames on the socket.
serde_json = "1"
