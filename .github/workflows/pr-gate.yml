name: PR gate

# Pull requests are limited to approved contributors for now. GitHub cannot
# block a fork from opening a PR, so this job closes PRs from anyone not on
# the allowlist and points them to the issue tracker instead.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Close PRs from non-approved authors
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ALLOWLIST: "junixdev"
        run: |
          for user in $ALLOWLIST; do
            if [ "$user" = "$AUTHOR" ]; then
              echo "$AUTHOR is approved."
              exit 0
            fi
          done
          gh pr comment "$PR" --repo "$REPO" --body "Thank you for the interest in chargecap! Pull requests are limited to approved contributors while the project is young, so this one is closed automatically. Please open an issue with your idea or bug report instead. If you would like to become a contributor, ask in an issue and the maintainer will get back to you. See CONTRIBUTING.md for details."
          gh pr close "$PR" --repo "$REPO"
