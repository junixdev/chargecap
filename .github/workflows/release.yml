name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the app bundle
        run: scripts/bundle.sh

      - name: Zip the app bundle
        run: |
          ditto -c -k --keepParent target/bundle/chargecap.app \
            "chargecap-${GITHUB_REF_NAME}-apple-silicon.zip"

      - name: Compute checksum
        run: |
          shasum -a 256 "chargecap-${GITHUB_REF_NAME}-apple-silicon.zip" \
            > "chargecap-${GITHUB_REF_NAME}-apple-silicon.zip.sha256"

      # The bundle is ad-hoc signed, not notarized. On first launch, users
      # must right-click the app and choose Open, then confirm the prompt.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            chargecap-${{ github.ref_name }}-apple-silicon.zip
            chargecap-${{ github.ref_name }}-apple-silicon.zip.sha256
