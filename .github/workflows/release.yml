name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the app bundle
        run: scripts/bundle.sh

      - name: Build the disk image
        run: |
          scripts/make-dmg.sh "chargecap-${GITHUB_REF_NAME}-apple-silicon.dmg"

      - name: Compute checksum
        run: |
          shasum -a 256 "chargecap-${GITHUB_REF_NAME}-apple-silicon.dmg" \
            > "chargecap-${GITHUB_REF_NAME}-apple-silicon.dmg.sha256"

      # The bundle is ad-hoc signed, not notarized. On first launch, users
      # must allow the app under System Settings > Privacy & Security. The
      # app's updater looks for the .dmg asset, so keep that extension.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            chargecap-${{ github.ref_name }}-apple-silicon.dmg
            chargecap-${{ github.ref_name }}-apple-silicon.dmg.sha256
